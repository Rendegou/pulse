<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>PULSE · 潮汐之间</title>
<script>
// 首屏防闪：绘制前读本地偏好设置 data-theme（与 preferences.js 同规则的最小副本）。
(function () {
  try {
    var t = localStorage.getItem("pulse.theme") || "system";
    var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
    var l = localStorage.getItem("pulse.lang");
    if (l) document.documentElement.lang = l;
  } catch (e) { /* 存储不可用时跟随默认 */ }
})();
</script>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- 三层画布共用同一世界坐标：海面（GPU 点集）/ 岛屿地形 / 浪沫·漂尘·植物·实时层 -->
<canvas id="sea" aria-hidden="true"></canvas>
<canvas id="land" tabindex="0" data-i18n-aria="worldLabel"></canvas>
<canvas id="air" aria-hidden="true"></canvas>
<!-- 岛标签与植物标签由 world.js 创建并定位；容器本身不接收指针 -->
<div id="labels"></div>

<header>
  <button class="brand" id="brand" data-i18n-aria="home">pulse<small id="edition">潮汐之间</small></button>
  <nav class="tools">
    <form id="address-form"><input id="address" maxlength="64" data-i18n-aria="addressLabel" data-i18n-ph="address"><button id="go" data-i18n-aria="go">↗</button></form>
    <button id="theme"></button>
    <button id="locale"></button>
    <button id="status-btn" data-i18n="statusOpen">状态</button>
    <button id="help" data-i18n="help">玩法</button>
    <span class="status"><span id="ws-dot" class="dot"></span><span id="ws-label">连接中…</span></span>
  </nav>
</header>

<section id="intro">
  <p class="eyebrow" id="eyebrow">海上手记</p>
  <h1 id="headline">潮汐之间</h1>
  <p id="description"></p>
  <button id="approach"><span id="approach-text"></span><span aria-hidden="true">↘</span></button>
</section>

<nav id="nearby" aria-label="nearby"><h2 id="nearby-title">海的另一边</h2></nav>

<!-- 照料面板：靠近后出现在画面下方中央；画布上的植物是同一个动作的入口 -->
<section id="care" hidden aria-label="照料植物">
  <p id="care-note" aria-live="polite"></p>
  <div class="care-actions">
    <button id="water">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C10 7 5 11 5 15a7 7 0 0 0 14 0c0-4-5-8-7-12Z"/></svg>
      <span id="water-label"></span>
    </button>
    <a id="visit" href="/?visitor=1" target="_blank" rel="noopener"></a>
  </div>
  <p id="care-detail"></p>
</section>

<!-- 植物上方的透明命中区：跟随投影缩放，悬停显示动作提示 -->
<div id="plant-target"><button id="plant-hit" aria-label="为植物浇水"></button><span id="plant-caption"></span></div>

<p id="presence" role="status"></p>
<p id="trace"></p>

<p id="hint"></p>
<div id="toast" role="status" aria-live="polite"></div>

<footer>
  <div class="footnote">
    <div class="coordinates" id="coordinates">000 / 000</div>
    <div id="fixture">示例岛屿 · 真实访客</div>
  </div>
  <div class="zoom">
    <button id="minus" data-i18n-aria="zoomOut">−</button>
    <output id="zoom">1.0×</output>
    <button id="plus" data-i18n-aria="zoomIn">+</button>
    <button id="origin">归处</button>
  </div>
</footer>

<dialog id="help-dialog"><button class="close" data-close="help-dialog" aria-label="×">×</button>
  <span class="dialog-label">PULSE</span>
  <h2 id="help-title"></h2><div id="help-copy"></div><p id="limit-copy"></p>
  <button id="system-theme"></button></dialog>

<!-- 运行状态抽屉：诊断内容（事件流/端口/指标/连接详情），默认收起 -->
<aside id="drawer" hidden>
  <button id="drawer-close" class="drawer-close" aria-label="关闭">×</button>
  <h3>RUNTIME</h3>
  <div class="drawer-row"><span id="sensor-badge" class="sensor-badge off">…</span><span id="chip-conns">—</span></div>
  <div class="section-title" id="feed-title">EVENT STREAM</div>
  <div class="feed" id="feed"></div>
  <div class="section-title" id="ports-title">PORTS · LIVE</div>
  <div class="ports" id="ports"></div>
  <div class="metrics">
    <div class="metric"><div class="label">ONLINE</div><div class="value" id="m-conns">0</div></div>
    <div class="metric"><div class="label">HOST/s</div><div class="value" id="m-hostrate">0/s</div></div>
    <div class="metric"><div class="label">HEAP</div><div class="value" id="m-heap">—</div></div>
    <div class="metric"><div class="label">SYS</div><div class="value" id="m-sys">—</div></div>
    <div class="metric"><div class="label">DROPPED</div><div class="value" id="m-dropped">0</div></div>
    <div class="metric"><div class="label">FRAME</div><div class="value" id="m-frame">—</div></div>
  </div>
</aside>

<script type="module" src="/app.js"></script>
</body>
</html>
