<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE · 粒子地表漫游</title>
<script>
// 首屏防闪：绘制前读本地偏好设置 data-theme（与 preferences.js 同规则的最小副本）。
(function () {
  try {
    var p = JSON.parse(localStorage.getItem("pulse-prefs") || "null") || {};
    var t = p.theme || "system";
    var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
    if (p.lang) document.documentElement.lang = p.lang;
  } catch (e) { /* 存储不可用时跟随默认 */ }
})();
</script>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="world" tabindex="0" data-i18n-aria="worldLabel"></canvas>

<header>
  <div class="brand">pulse</div>
  <form id="address-form"><input id="address" maxlength="64" data-i18n-aria="addressLabel" data-i18n-ph="address"><button id="go" data-i18n-aria="go">↗</button></form>
  <div class="tools">
    <button id="theme"></button>
    <button id="locale"></button>
    <button id="status-btn" data-i18n="statusOpen">状态</button>
    <button id="help" data-i18n="help">玩法</button>
    <span class="status-chip" title="live"><span id="ws-dot" class="dot"></span><span id="chip-conns">–</span></span>
  </div>
</header>

<div class="context"><h1 id="place">无界原野</h1><p id="sub"></p><button id="back" class="action" hidden>↑</button></div>

<nav id="nearby" aria-label="nearby"><div class="near-label" id="near-label">附近的空间</div>
  <button data-near="origin"></button><button data-near="rain"></button><button data-near="letter"></button>
</nav>

<section id="selection" hidden>
  <h2 id="house-name"></h2><p id="house-desc"></p>
  <button id="enter" class="primary" data-i18n="enter">向下进入</button>
  <button id="dismiss" class="secondary" data-i18n="cancel">取消</button>
  <div id="books" class="book-list" hidden></div>
</section>

<div id="hint"></div><div id="notice" role="status" aria-live="polite"></div>

<footer class="bottom">
  <div><div id="coordinates" class="coords">x 0 · y 0</div>
    <div class="meta"><span class="dot"></span><span id="demo-label" data-i18n="demo">示例房屋 · 真实访客</span></div></div>
  <div class="controls">
    <button id="minus" data-i18n-aria="zoomOut">−</button>
    <span class="zoomlabel" id="zoom-label">1×</span>
    <button id="plus" data-i18n-aria="zoomIn">+</button>
    <button id="origin" class="home" data-i18n="home">归处</button>
  </div>
</footer>

<dialog id="help-dialog"><button class="close" data-close="help-dialog" aria-label="×">×</button>
  <h2 id="help-title"></h2><p id="help-copy"></p><p id="limit-copy"></p>
  <button id="system-theme"></button></dialog>

<dialog id="reader"><button class="close" data-close="reader" aria-label="×">×</button>
  <div class="source" id="article-source"></div><h2 id="article-title"></h2><div id="article-body"></div></dialog>

<!-- 运行状态抽屉：诊断内容（事件流/端口/指标/连接详情），默认收起 -->
<aside id="drawer" hidden>
  <h3 id="kicker">RUNTIME</h3>
  <div class="drawer-row"><span id="ws-label">…</span><span id="sensor-badge" class="sensor-badge off">…</span></div>
  <div class="section-title" id="feed-title">EVENT STREAM</div>
  <div class="feed" id="feed"></div>
  <div class="section-title" id="ports-title">PORTS · LIVE</div>
  <div class="ports" id="ports"></div>
  <div class="metrics">
    <div class="metric"><div class="label">ONLINE</div><div class="value" id="m-conns">0</div></div>
    <div class="metric"><div class="label">HOST/s</div><div class="value" id="m-hostrate">0/s</div></div>
    <div class="metric"><div class="label">HEAP</div><div class="value" id="m-heap">—</div></div>
    <div class="metric"><div class="label">SYS</div><div class="value" id="m-sys">—</div></div>
    <div class="metric"><div class="label">DROPPED</div><div class="value" id="m-dropped">0</div></div>
  </div>
</aside>

<script type="module" src="/app.js"></script>
</body>
</html>
