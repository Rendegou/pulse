<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PULSE · 粒子纵深（离线原型）</title>
<style>
/* 原型样式：主题变量与产品 tokens.css 语义一致但不共享。 */
:root{
  --bg:#1c2b30; --ink:#dcebe6; --muted:#8fa8a4; --line:#3d5a58;
  --panel:#12262cee; --accent:#d9a468; --focus:#8fd0c0;
  --world-land:#6f9c8a; --world-water:#8fb3ad;
  --world-line:#a8c5b6; --world-paper:#e6dfc9; --world-page-ink:#22332f;
  --world-muted:#8fa8a4;
}
[data-theme="light"]{
  --bg:#dfe9e2; --ink:#22332f; --muted:#4c6b64; --line:#b9ccbf;
  --panel:#f4f8f0ee; --accent:#a06a33; --focus:#237761;
  --world-land:#4d7f6c; --world-water:#a9c6bb;
  --world-line:#45655a; --world-paper:#f4efdf; --world-page-ink:#263a34;
  --world-muted:#4c6b64;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.6"Segoe UI","Microsoft YaHei",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:hover{color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
#world{display:block;width:100vw;height:100dvh;touch-action:none;cursor:grab}
#world.drag{cursor:grabbing}
header{position:fixed;inset:20px 26px auto;display:flex;align-items:center;justify-content:space-between;
  gap:16px;pointer-events:none}
header>*{pointer-events:auto}
.brand{font:600 20px/1.2 Georgia,"Songti SC",serif;letter-spacing:.1em}
.badge{font:11px/1 ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px}
.tools{display:flex;gap:8px;align-items:center}
.tools button{padding:7px 10px}
#address-form{display:flex;gap:6px}
#address{width:200px;background:transparent;border:1px solid var(--line);border-radius:99px;
  padding:6px 12px;color:inherit}
#selection{position:fixed;right:26px;top:84px;width:250px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;backdrop-filter:blur(6px)}
#selection h2{margin:0 0 4px;font:600 17px/1.3 Georgia,"Songti SC",serif}
#selection p{margin:0 0 10px;color:var(--muted);font-size:12.5px}
#selection .actions{display:flex;gap:8px}
#enter,#dismiss{padding:6px 12px;border:1px solid var(--line);border-radius:99px}
#enter{color:var(--accent)}
footer.bottom{position:fixed;left:26px;right:26px;bottom:20px;display:flex;justify-content:space-between;
  align-items:flex-end;pointer-events:none}
footer.bottom>*{pointer-events:auto}
.coords{font:12px/1.5 ui-monospace,monospace;color:var(--muted)}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.controls{display:flex;align-items:center;gap:6px}
.controls button{padding:5px 10px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.controls button:hover{color:var(--accent)}
.zoomlabel{font:12px/1 ui-monospace,monospace;color:var(--muted);min-width:34px;text-align:center}
#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);color:var(--muted);font-size:12.5px;
  pointer-events:none}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);
  max-width:min(560px,92vw);padding:22px 26px}
dialog::backdrop{background:rgba(4,12,16,.55)}
dialog .close{position:absolute;right:12px;top:10px;color:var(--muted)}
#help-dialog p{color:var(--muted);font-size:13px}
#help-dialog h2{margin:0 0 10px;font:600 18px/1.3 Georgia,"Songti SC",serif}
#reader .source{font:11px/1.4 ui-monospace,monospace;color:var(--accent);letter-spacing:.04em}
#reader h2{margin:8px 0 10px;font:600 22px/1.35 Georgia,"Songti SC",serif}
#reader p{margin:0 0 12px;font-size:14.5px;line-height:1.9;color:var(--ink)}
@media (max-width:640px){
  header{inset:14px 14px auto}
  #address{width:120px}
  #selection{right:14px;top:70px;width:min(250px,58vw)}
  footer.bottom{left:14px;right:14px}
  #hint{display:none}
}
</style>
</head>
<body>
<canvas id="world" tabindex="0" aria-label="可拖动缩放的粒子纵深世界"></canvas>

<header>
  <div class="brand">pulse</div>
  <span class="badge">离线原型 · 粒子纵深 · 无服务器</span>
  <div class="tools">
    <form id="address-form"><input id="address" maxlength="64" placeholder="输入一个地点，去那里"><button id="go" aria-label="前往">↗</button></form>
    <button id="theme" aria-label="切换主题">明亮</button>
    <button id="locale" aria-label="切换语言">EN</button>
    <button id="help">玩法</button>
  </div>
</header>

<section id="selection" hidden>
  <h2 id="house-name"></h2><p id="house-desc"></p>
  <div class="actions"><button id="enter" class="primary">阅读全文</button><button id="dismiss">取消</button></div>
</section>

<div id="hint">拖动漫游 · 滚轮靠近 · 点开一粒文章标签</div>

<footer class="bottom">
  <div>
    <div id="coordinates" class="coords">x 0 · y 0</div>
    <div class="meta"><span class="dot"></span><span>示例文章 · 文章标签与示例</span></div>
  </div>
  <div class="controls">
    <button id="minus" aria-label="缩小">−</button>
    <span class="zoomlabel" id="zoom-label">1×</span>
    <button id="plus" aria-label="放大">+</button>
    <button id="origin">归处</button>
  </div>
</footer>

<dialog id="help-dialog">
  <button class="close" data-close="help-dialog" aria-label="关闭">×</button>
  <h2>粒子纵深 · 先让靠近产生纵深</h2>
  <p>俯瞰一片有起伏的粒子地表。滚轮推进的是镜头距离：近处的粒子先胀大滑出视野，中间的内容随后展开，远处的地表变化缓慢——三层速度来自同一个镜头投影。</p>
  <p>拖动平移，方向键漫游。三篇示例文章落在粒子面不同的高度处，各有小型标题标签；点标签查看预览，再点“阅读全文”。停止操作时画面保持静止。</p>
  <p>这是<b>离线原型</b>：不连接服务器，文章与地形为本机示例。</p>
</dialog>

<dialog id="reader">
  <button class="close" data-close="reader" aria-label="关闭">×</button>
  <div class="source">示例文章 · 原型本地数据</div>
  <h2 id="article-title"></h2>
  <div id="article-body"></div>
</dialog>

<script>
"use strict";
/* =====================================================================
   PULSE 粒子纵深 —— 独立离线原型（docs/13）
   ---------------------------------------------------------------------
   方向：俯瞰粒子地表；滚轮=镜头距离；深度由运动显现
   （近点放大快、远处慢，来自同一个透视投影，不是装饰层）。
   产品 static/ 未被修改；本文件是方向验证的独立副本，全部逻辑内联。
   ===================================================================== */

// ---------- 可调参数 ----------
const TUNE = {
  camD0: 34, camDMin: 8, camDMax: 120,
  tilt: 0.19, fov: 1.13,
  moundR: 95, moundH: 16,
  budget: 26000, floats: 26, tileMax: 260,
};
const ARTICLE_SPOTS = [{ x: 0, y: -10 }, { x: 86, y: 34 }, { x: -78, y: 58 }];

// ---------- 示例文章（zh/en） ----------
const ARTICLES = {
  "zh-CN": {
    titles: ["把一段时间放在这里", "关于远方的坐标", "有些相遇不需要说话"],
    paras: [
      ["我们习惯把文章放进列表。这一次，让它成为世界里的一粒悬浮的灯。",
       "远处的文章聚成一片起伏之地，靠近后，标题从粒子的空隙间浮现出来。"],
      ["拖动改变的是你所在的坐标；滚轮改变的是镜头与地面的距离。",
       "近处的粒子先扩大离开视野，远处地表变化缓慢——纵深由运动显现。"],
      ["别人的微光轻轻经过，停在同一片粒子面旁。",
       "岛屿与文字是示例；访客由真实连接提供。真实文章的保存与作者身份还需要继续接入。"],
    ],
  },
  en: {
    titles: ["A little time, kept here", "Coordinates of somewhere else", "Being here, together"],
    paras: [
      ["We usually put writing in a list. Here it becomes a floating mote in the world.",
       "A distant collection becomes a swell of land; closer, titles surface between particles."],
      ["Dragging changes where you are. The wheel changes the lens distance.",
       "Near particles swell and leave first; far terrain moves slowly — depth shows through motion."],
      ["A light passes quietly and pauses beside the same field.",
       "Islands and writing are samples; visitors come from live connections."],
    ],
  },
};

// ---------- 纯计算 ----------
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function hash(x, y, s = 0) {
  let n = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1274126177);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}
// mixToFog 按 f 向雾色混合（远处点淡去的“大气”），fog 取背景色。
function mixToFog(rgb, f) {
  if (f <= 0.01) return "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
  const fog = hexToRgb(palette.bg);
  return "rgb(" + Math.round(rgb[0] + (fog[0] - rgb[0]) * f) + "," +
    Math.round(rgb[1] + (fog[1] - rgb[1]) * f) + "," + Math.round(rgb[2] + (fog[2] - rgb[2]) * f) + ")";
}
// groundH 地面高度：个人区域丘 + 缓慢起伏（世界平面坐标 → 高度）。
function groundH(x, y) {
  const d = Math.hypot(x, y);
  const mound = TUNE.moundH * Math.exp(-(d / TUNE.moundR) * (d / TUNE.moundR));
  const roll = 0.35 * Math.sin(x * 0.012) * Math.sin(y * 0.013) + 0.2 * Math.sin((x + y) * 0.021);
  const fall = -1.6 * Math.exp(-(d / 320) * (d / 320));
  return mound + roll + fall;
}
function sampleAlpha(x, y, h) {
  const d = Math.hypot(x, y);
  const edge = clamp(1.15 - d / 420, 0.18, 1);
  const high = clamp(0.55 + h / 10, 0.4, 1);
  return clamp(edge * high, 0.1, 1);
}

// ---------- 相机与投影（命中/锚定/指针共用同一套） ----------
const camera = { x: 0, y: 0, camD: TUNE.camD0, tilt: TUNE.tilt };
function proj(x, y, z = null) {
  const h = z === null ? groundH(x, y) : z;
  const cpx = x - camera.x, cpy = y - camera.y;
  const st = Math.sin(camera.tilt);
  const depth = Math.max(camera.camD + TUNE.moundH - h - cpy * st * 0.35, TUNE.camDMin * 0.3);
  const k = fpx / depth;
  const yf = 0.9 - st * 0.35;
  return { x: W * 0.5 + cpx * k, y: H * 0.5 + cpy * yf * k, scale: k, d: depth };
}
function unproj(sx, sy) {
  const st = Math.sin(camera.tilt), yf = 0.9 - st * 0.35;
  const sxs = sx - W * 0.5, sys = sy - H * 0.5;
  let x = camera.x, y = camera.y;
  for (let i = 0; i < 8; i++) {
    const cpy = y - camera.y;
    const depth = Math.max(camera.camD + TUNE.moundH - groundH(x, y) - cpy * st * 0.35, TUNE.camDMin * 0.3);
    const k = fpx / depth;
    x = camera.x + sxs / k;
    y = camera.y + sys / (k * yf);
  }
  return { x, y };
}

// ---------- 状态 ----------
const state = {
  flight: null, velocity: { x: 0, y: 0 }, gesture: null, pointers: new Map(),
  selected: null, hits: [], lastTime: 0, visible: true, raf: 0,
  tickCount: 0, frameMs: 0, scenePaints: 0, particles: 0, floatsDrawn: 0,
};
let canvas, ctx, W = 0, H = 0, fpx = 600;
let theme = "dark", motionReduced = false;
let paletteVersion = 0, sceneCache = null, sceneCacheKey = "";
const terrainTiles = new Map();
let palette = {};
let lang = "zh-CN";

// ---------- 主题 ----------
function refreshPalette() {
  const cs = getComputedStyle(document.documentElement);
  const get = (k) => cs.getPropertyValue(k).trim();
  palette = { bg: get("--bg"), land: get("--world-land"), water: get("--world-water"),
    line: get("--world-line"), accent: get("--accent"), paper: get("--world-paper"),
    pageInk: get("--world-page-ink"), muted: get("--world-muted") };
  paletteVersion++;
}

// ---------- 地表渲染 ----------
function tileStep() {
  const hi = unproj(-20, -20), lo = unproj(W + 20, H + 20);
  const area = Math.abs((hi.x - lo.x) * (hi.y - lo.y));
  let step = 8 * camera.camD / fpx;
  if (area / (step * step) > TUNE.budget) step = Math.sqrt(area / TUNE.budget);
  return Math.max(0.14, step);
}
function terrainTile(step, tx, ty) {
  const key = step + ":" + tx + ":" + ty;
  let pts = terrainTiles.get(key);
  if (pts) { terrainTiles.delete(key); terrainTiles.set(key, pts); return pts; }
  pts = [];
  const size = step * 16;
  for (let iy = 0; iy < 16; iy++) {
    for (let ix = 0; ix < 16; ix++) {
      const gx = tx * 16 + ix, gy = ty * 16 + iy;
      const x = (gx + 0.2 + hash(gx, gy, 12) * 0.6) * step;
      const y = (gy + 0.2 + hash(gx, gy, 13) * 0.6) * step;
      const h = groundH(x, y);
      pts.push(x, y, h, sampleAlpha(x, y, h));
    }
  }
  terrainTiles.set(key, pts);
  if (terrainTiles.size > TUNE.tileMax) terrainTiles.delete(terrainTiles.keys().next().value);
  return pts;
}
function drawTerrain() {
  const step = tileStep();
  const hi = unproj(-30, -30), lo = unproj(W + 30, H + 30);
  const size = step * 16;
  const tx0 = Math.floor(hi.x / size), tx1 = Math.floor(lo.x / size);
  const ty0 = Math.floor(hi.y / size), ty1 = Math.floor(lo.y / size);
  const tiles = [];
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const c = proj(tx * size + size / 2, ty * size + size / 2);
      tiles.push({ tx, ty, d: c.d });
    }
  }
  tiles.sort((a, b) => b.d - a.d);
  let drawn = 0;
  const maxD = camera.camD * 3.2;
  for (const t of tiles) {
    const pts = terrainTile(step, t.tx, t.ty);
    const tFog = clamp((t.d - camera.camD) / maxD, 0, 0.85);
    for (let i = 0; i < pts.length; i += 4) {
      const p = proj(pts[i], pts[i + 1], pts[i + 2]);
      if (p.x < -4 || p.x > W + 4 || p.y < -4 || p.y > H + 4) continue;
      const size = clamp(fpx * 0.42 / p.d, 0.7, 3.2);
      const a = clamp((1.3 - p.d / maxD) * pts[i + 3] * (1 - tFog), 0.05, 0.95);
      if (a < 0.04) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = pts[i + 2] < 0.6 ? palette.water : palette.land;
      ctx.fillRect(p.x, p.y, size, size);
      drawn++;
    }
  }
  ctx.globalAlpha = 1;
  state.particles = drawn;
}
function drawFloats() {
  if (TUNE.floats <= 0) return;
  const pts = [];
  for (let i = 0; i < TUNE.floats; i++) {
    const a = hash(i, 7, 31) * Math.PI * 2;
    const r = 6 + hash(i, 7, 32) * 30;
    const x = camera.x + Math.cos(a) * r, y = camera.y + Math.sin(a) * r;
    const h = groundH(x, y) + 3 + hash(i, 7, 33) * 8;
    const p = proj(x, y, h);
    if (p.x < -8 || p.x > W + 8 || p.y < -8 || p.y > H + 8) continue;
    pts.push({ p, k: hash(i, 7, 34) });
  }
  pts.sort((a, b) => b.p.d - a.p.d);
  let n = 0;
  for (const f of pts) {
    const size = clamp(fpx * 0.6 / f.p.d, 1.0, 4.2);
    const a = clamp((1.4 - f.p.d / (camera.camD * 2.4)) * 0.55, 0.08, 0.6);
    ctx.globalAlpha = a;
    ctx.fillStyle = palette.line;
    ctx.fillRect(f.p.x, f.p.y, size, size);
    n++;
  }
  ctx.globalAlpha = 1;
  state.floatsDrawn = n;
}
function textW(text, fontPx) {
  return (text ? String(text).length : 4) * fontPx * 0.62;
}
function markerAnchor(i) {
  const s = ARTICLE_SPOTS[i];
  return { x: s.x, y: s.y, h: groundH(s.x, s.y) };
}
function markerScreen(i) {
  const a = markerAnchor(i);
  const p = proj(a.x, a.y, a.h);
  const title = ARTICLES[lang].titles[i] || "";
  const labelW = textW(title, 12) + 18;
  return { x: p.x, y: p.y - 26, ground: p, labelW, labelH: 24 };
}
function drawMarkers() {
  ctx.save();
  for (let i = 0; i < ARTICLES[lang].titles.length; i++) {
    const m = markerScreen(i);
    const title = ARTICLES[lang].titles[i];
    const sel = state.selected && state.selected.i === i;
    ctx.font = "12px Georgia,'Songti SC',SimSun,serif";
    ctx.fillStyle = palette.paper;
    roundRect(m.x - m.labelW / 2, m.y - m.labelH / 2, m.labelW, m.labelH, 6);
    ctx.fill();
    ctx.strokeStyle = sel ? palette.accent : palette.line;
    ctx.lineWidth = sel ? 1.6 : 1;
    ctx.stroke();
    ctx.fillStyle = palette.pageInk;
    ctx.textAlign = "center";
    ctx.fillText(title, m.x, m.y + 4);
    ctx.strokeStyle = palette.muted;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(m.x, m.y + m.labelH / 2); ctx.lineTo(m.ground.x, m.ground.y); ctx.stroke();
    ctx.fillStyle = sel ? palette.accent : palette.line;
    ctx.beginPath(); ctx.arc(m.ground.x, m.ground.y, 2.2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  state.hits = ARTICLES[lang].titles.map((t, i) => {
    const m = markerScreen(i);
    return { i, x: m.x, y: m.y, r: Math.max(26, m.labelW / 2 + 6) };
  });
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function composeStatic() {
  const d = Math.min(devicePixelRatio || 1, 2);
  const width = Math.round(W * d), height = Math.round(H * d);
  if (!sceneCache) sceneCache = document.createElement("canvas");
  if (sceneCache.width !== width || sceneCache.height !== height) {
    sceneCache.width = width; sceneCache.height = height;
  }
  const g = sceneCache.getContext("2d");
  const prev = ctx; ctx = g;
  g.setTransform(d, 0, 0, d, 0, 0);
  try {
    g.fillStyle = palette.bg;
    g.fillRect(0, 0, W, H);
    drawTerrain();
    drawFloats();
    drawMarkers();
  } finally { ctx = prev; }
}
function render(now) {
  state.raf = 0;
  if (!state.visible) return;
  const start = performance.now();
  try {
    const dt = Math.min(40, now - (state.lastTime || now));
    state.lastTime = now;
    advance(now, dt);
    const key = [camera.x, camera.y, camera.camD, W, H, paletteVersion].join("|");
    if (sceneCacheKey !== key) {
      composeStatic();
      sceneCacheKey = key;
      state.scenePaints++;
    }
    ctx.drawImage(sceneCache, 0, 0, W, H);
    state.tickCount++;
  } catch (err) {
    window.__worldErrors = window.__worldErrors || [];
    window.__worldErrors.push(String(err && err.stack || err));
  }
  const cost = performance.now() - start;
  state.frameMs = state.frameMs ? state.frameMs * 0.9 + cost * 0.1 : cost;
  state.raf = requestAnimationFrame(render);
}
function advance(now, dt) {
  if (state.flight) {
    const f = state.flight;
    const k = clamp((now - f.at) / f.ms, 0, 1);
    const e = k * k * (3 - 2 * k);
    camera.x = f.from.x + (f.to.x - f.from.x) * e;
    camera.y = f.from.y + (f.to.y - f.from.y) * e;
    camera.camD = Math.exp(Math.log(f.from.camD) + (Math.log(f.to.camD) - Math.log(f.from.camD)) * e);
    if (k === 1) { state.flight = null; if (f.onDone) f.onDone(); }
    return;
  }
  if (!state.gesture && !motionReduced) {
    camera.x += state.velocity.x * dt;
    camera.y += state.velocity.y * dt;
    const decay = Math.exp(-dt / 150);
    state.velocity.x *= decay; state.velocity.y *= decay;
    if (Math.hypot(state.velocity.x, state.velocity.y) < 0.0004) state.velocity = { x: 0, y: 0 };
  }
}
function stopFlight() { state.flight = null; state.velocity = { x: 0, y: 0 }; }

// ---------- 交互 ----------
function zoomAt(factor, x = W / 2, y = H * 0.5) {
  stopFlight();
  const before = unproj(x, y);
  const oldD = camera.camD;
  camera.camD = clamp(camera.camD * factor, TUNE.camDMin, TUNE.camDMax);
  for (let i = 0; i < 2; i++) {
    const p = proj(before.x, before.y);
    camera.x += (p.x - x) / Math.max(p.scale, 0.01);
    camera.y += (p.y - y) / Math.max(p.scale * 0.9, 0.01);
  }
  return camera.camD !== oldD;
}
function flyTo(to, onDone, ms = 1200) {
  state.velocity = { x: 0, y: 0 };
  state.flight = { from: { x: camera.x, y: camera.y, camD: camera.camD }, to,
    at: performance.now(), ms: motionReduced ? 1 : ms, onDone };
}
function selectMarker(m) { state.selected = m; showPanel(m); }
function pick(x, y) {
  for (const h of [...state.hits].reverse()) {
    if (Math.hypot(x - h.x, y - h.y) < h.r || (Math.abs(x - h.x) < h.r && Math.abs(y - h.y) < 20)) {
      selectMarker({ i: h.i });
      return;
    }
  }
  selectMarker(null);
}
function panAnchor(point, screen) {
  const now = unproj(screen.x, screen.y);
  camera.x += point.x - now.x;
  camera.y += point.y - now.y;
}
function startGesture() {
  const p = [...state.pointers.values()];
  if (p.length === 1) {
    state.gesture = { anchor: unproj(p[0].x, p[0].y), start: { ...p[0] }, moved: false, last: performance.now() };
  } else if (p.length >= 2) {
    const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
    state.gesture = { pinch: true, anchor: unproj(mid.x, mid.y), distance: Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y), camD: camera.camD, moved: true };
  } else state.gesture = null;
}
function bindGestures() {
  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    stopFlight();
    canvas.setPointerCapture(e.pointerId);
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    startGesture();
    canvas.classList.add("drag");
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!state.pointers.has(e.pointerId)) return;
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...state.pointers.values()], g = state.gesture;
    if (!g) return;
    if (p.length >= 2) {
      const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      zoomAt(g.camD * Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y) / Math.max(1, g.distance) / camera.camD, mid.x, mid.y);
    } else {
      const now = performance.now(), oldX = camera.x, oldY = camera.y;
      panAnchor(g.anchor, p[0]);
      const dt = Math.max(8, now - g.last);
      state.velocity = { x: (camera.x - oldX) / dt, y: (camera.y - oldY) / dt };
      g.last = now;
      g.moved ||= Math.hypot(p[0].x - g.start.x, p[0].y - g.start.y) > 5;
    }
  });
  const endPointer = (e, cancelled = false) => {
    const g = state.gesture;
    const click = !cancelled && g && !g.pinch && !g.moved;
    state.pointers.delete(e.pointerId);
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    if (click) pick(e.clientX, e.clientY);
    if (cancelled || click || g?.pinch) state.velocity = { x: 0, y: 0 };
    if (state.pointers.size) { startGesture(); state.gesture.moved = true; }
    else { state.gesture = null; canvas.classList.remove("drag"); }
  };
  canvas.addEventListener("pointerup", (e) => endPointer(e));
  canvas.addEventListener("pointercancel", (e) => endPointer(e, true));
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H : 1);
    zoomAt(Math.exp(d * 0.0022), e.clientX, e.clientY);
  }, { passive: false });
  window.addEventListener("blur", () => {
    state.pointers.clear(); state.gesture = null; state.velocity = { x: 0, y: 0 };
    canvas.classList.remove("drag");
  });
}

// ---------- HUD/面板 ----------
const $ = (id) => document.getElementById(id);
function showPanel(marker) {
  const s = marker && state.selected;
  $("selection").hidden = !s;
  if (!s) return;
  const i = s.i;
  $("house-name").textContent = ARTICLES[lang].titles[i];
  $("house-desc").textContent = ARTICLES[lang].paras[i][0];
}
function updateReadout() {
  const fmt = new Intl.NumberFormat(lang, { maximumFractionDigits: 0 });
  $("coordinates").textContent = "x " + fmt.format(camera.x) + " · y " + fmt.format(camera.y);
  $("zoom-label").textContent = (34 / camera.camD).toFixed(camera.camD < 30 ? 1 : 0) + "×";
}
function openArticle(i) {
  $("article-title").textContent = ARTICLES[lang].titles[i];
  const body = $("article-body");
  body.replaceChildren();
  for (const p of ARTICLES[lang].paras[i]) {
    const el = document.createElement("p");
    el.textContent = p;
    body.appendChild(el);
  }
  $("reader").showModal();
}
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  $("theme").textContent = theme === "dark" ? "明亮" : "月光";
  refreshPalette();
}
function resize() {
  W = innerWidth;
  H = canvas.parentElement.clientHeight || innerHeight;
  fpx = (H / 2) / Math.tan(TUNE.fov / 2);
  const d = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * d);
  canvas.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  sceneCacheKey = "";
}

// ---------- 启动 ----------
function init() {
  canvas = $("world");
  ctx = canvas.getContext("2d");
  motionReduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  applyTheme();
  resize();
  window.addEventListener("resize", resize);
  bindGestures();
  document.addEventListener("visibilitychange", () => {
    state.visible = !document.hidden;
    if (!state.visible) { cancelAnimationFrame(state.raf); state.raf = 0; }
    else if (!state.raf) { state.lastTime = 0; state.raf = requestAnimationFrame(render); }
  });
  $("theme").addEventListener("click", () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(); });
  $("locale").addEventListener("click", () => {
    lang = lang === "zh-CN" ? "en" : "zh-CN";
    document.documentElement.lang = lang;
    $("locale").textContent = lang === "zh-CN" ? "EN" : "中文";
    paletteVersion++;
  });
  $("help").addEventListener("click", () => $("help-dialog").showModal());
  $("plus").addEventListener("click", () => zoomAt(1 / 1.35));
  $("minus").addEventListener("click", () => zoomAt(1.35));
  $("origin").addEventListener("click", () => flyTo({ x: 0, y: 0, camD: 34 }));
  $("enter").addEventListener("click", () => { if (state.selected) openArticle(state.selected.i); });
  $("dismiss").addEventListener("click", () => selectMarker(null));
  $("address-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const value = $("address").value.trim().normalize("NFC");
    if (!value) return;
    let h = 2166136261;
    for (const ch of value) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
    const x = ((h >>> 0) % 10001 - 5000) * 560;
    const y = ((Math.imul(h, 2246822519) >>> 0) % 10001 - 5000) * 560;
    flyTo({ x, y, camD: 60 });
  });
  document.querySelectorAll("[data-close]").forEach((el) =>
    el.addEventListener("click", () => $(el.dataset.close).close()));
  window.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || $("reader").open || $("help-dialog").open) return;
    const step = 75 * (camera.camD / 34);
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
      e.preventDefault();
      flyTo({
        x: camera.x + (e.key === "ArrowRight" ? step : e.key === "ArrowLeft" ? -step : 0),
        y: camera.y + (e.key === "ArrowDown" ? step : e.key === "ArrowUp" ? -step : 0),
        camD: camera.camD,
      }, null, 220);
    }
    if (e.key === "+" || e.key === "=") zoomAt(1 / 1.25);
    if (e.key === "-") zoomAt(1.25);
    if (e.key === "Escape") selectMarker(null);
  });
  updateReadout();
  state.raf = requestAnimationFrame(render);
}
window.addEventListener("error", (e) => {
  window.__worldErrors = window.__worldErrors || [];
  window.__worldErrors.push(e.message);
});

// ---------- 验收句柄（只读 + 受控相机） ----------
window.PULSE_WORLD = {
  snapshot() {
    return {
      tick: state.tickCount,
      camera: { x: camera.x, y: camera.y, camD: camera.camD, tilt: camera.tilt },
      flight: !!state.flight, selected: state.selected ? state.selected.i : null,
      particles: state.particles, floats: state.floatsDrawn,
      scenePaints: state.scenePaints, tiles: terrainTiles.size, gesture: !!state.gesture,
      markers: ARTICLES[lang].titles.length,
      errors: window.__worldErrors || [],
    };
  },
  setCamD(camD) { camera.camD = clamp(camD, TUNE.camDMin, TUNE.camDMax); },
  project(x, y, z = null) { return proj(x, y, z); },
  unproject(x, y) { return unproj(x, y); },
  markerScreen(i) { return markerScreen(i); },
  zoomAtFactor(f) { zoomAt(f, W / 2, H / 2); },
};

init();
</script>
</body>
</html>
